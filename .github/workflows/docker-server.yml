name: Build & Publish Livebox Monitor Server (GHCR)

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "packages/livebox_client/**"
      - ".dockerignore"
      - ".github/workflows/docker-server.yml"
    tags:
      - "server-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install libsqlite3 for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze packages/livebox_client
        working-directory: packages/livebox_client
        run: |
          dart pub get
          dart analyze

      - name: Test server
        working-directory: server
        run: |
          dart pub get
          dart test

  docker:
    name: Build & Push Docker Image (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract server version from pubspec.yaml
        id: ver
        run: |
          VERSION=$(grep '^version:' server/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LOWER}/livebox-monitor-server" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
