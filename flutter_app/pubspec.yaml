name: livebox_monitor
description: "Modern Flutter desktop interface to monitor & administrate Orange Livebox 4, 5, 6, 7, W7, S & Pro routers."
publish_to: 'none'

version: 1.7.4+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  fl_chart: ^1.3.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
